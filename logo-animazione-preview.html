<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anteprima animazione logo — Autoscuole Gasparella</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Montserrat', sans-serif; background: #0e2f42; color: #fff;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.6rem; padding: 2rem 1rem;
  }
  .page-title { font-size: .95rem; font-weight: 700; letter-spacing: .04em; color: #cfe6f5; text-align: center; }
  .page-sub { font-size: .78rem; color: #8fb4c8; text-align: center; max-width: 480px; margin-top: -.8rem; line-height: 1.5; }

  .stage {
    position: relative; width: 640px; max-width: 92vw; aspect-ratio: 16 / 9;
    background: #1280C2; overflow: hidden; border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }

  .mark-group {
    position: absolute; left: 50%; top: 50%;
    width: 120px; height: 120px;
    transform: translate(-50%, -50%);
  }
  .mark-group.play { animation: slideLeft 0.7s cubic-bezier(.22,1,.36,1) 1.05s both; }
  @keyframes slideLeft {
    from { transform: translate(-50%, -50%) scale(1.15); }
    to   { transform: translate(-50%, -50%) translateX(-148px) scale(1); }
  }

  .piece { position: absolute; inset: 0; opacity: 0; }
  .piece svg { width: 100%; height: 100%; display: block; }

  .play .piece-tl { animation: assembleTL 0.55s cubic-bezier(.16,1,.3,1) 0.10s both; }
  .play .piece-br { animation: assembleBR 0.55s cubic-bezier(.16,1,.3,1) 0.16s both; }
  .play .piece-swoosh { animation: assembleSwoosh 0.5s cubic-bezier(.16,1,.3,1) 0.30s both; }

  @keyframes assembleTL {
    from { transform: translate(-90px,-70px) scale(.4) rotate(-25deg); opacity: 0; }
    to   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes assembleBR {
    from { transform: translate(90px,70px) scale(.4) rotate(25deg); opacity: 0; }
    to   { transform: translate(0,0) scale(1) rotate(0deg); opacity: 1; }
  }
  @keyframes assembleSwoosh {
    from { transform: translate(110px,-14px) scale(.5); opacity: 0; }
    to   { transform: translate(0,0) scale(1); opacity: 1; }
  }

  .flash {
    position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
    transform: translate(-50%,-50%); border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 70%);
    opacity: 0; pointer-events: none;
  }
  .play .flash { animation: flashPop 0.35s ease-out 0.80s both; }
  @keyframes flashPop {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.3); }
    35%  { opacity: .9; transform: translate(-50%,-50%) scale(2.6); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(4.2); }
  }

  .text-group {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    margin-left: 62px; white-space: nowrap;
  }
  .txt-autoscuole, .txt-gasparella { opacity: 0; }
  .play .txt-autoscuole { animation: fadeUp 0.35s cubic-bezier(.16,1,.3,1) 1.40s both; }
  .play .txt-gasparella { animation: fadeRight 0.45s cubic-bezier(.16,1,.3,1) 1.55s both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeRight {
    from { opacity: 0; transform: translateX(20px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .txt-autoscuole {
    font-style: italic; font-weight: 800; font-size: 13px; letter-spacing: .22em;
    color: #fff; margin-bottom: 2px;
  }
  .txt-gasparella {
    font-weight: 900; font-size: 40px; letter-spacing: -.01em; color: #fff; line-height: 1;
  }

  .controls { display: flex; gap: .8rem; align-items: center; }
  #replayBtn {
    background: #fff; color: #1280C2; border: none; border-radius: 999px;
    padding: .65rem 1.5rem; font-family: inherit; font-weight: 700; font-size: .8rem;
    letter-spacing: .04em; cursor: pointer; transition: transform .15s ease;
  }
  #replayBtn:hover { transform: translateY(-2px); }
  #timeLabel { font-size: .75rem; color: #8fb4c8; font-variant-numeric: tabular-nums; min-width: 3.2em; }
</style>
</head>
<body>

  <div class="page-title">Anteprima — animazione logo Autoscuole Gasparella (3s)</div>
  <div class="page-sub">Ricostruzione approssimata del simbolo (rombo + swoosh) via CSS/SVG — sostituibile 1:1 con il vettore originale del logo per un match pixel-perfect.</div>

  <div class="stage" id="stage">
    <div class="mark-group" id="markGroup">
      <div class="piece piece-tl">
        <svg viewBox="0 0 120 120"><path d="M60 6 L96 42 L60 60 L24 42 Z" fill="#ffffff"/></svg>
      </div>
      <div class="piece piece-br">
        <svg viewBox="0 0 120 120"><path d="M60 60 L96 78 L60 114 L24 78 Z" fill="#ffffff"/></svg>
      </div>
      <div class="piece piece-swoosh">
        <svg viewBox="0 0 120 120">
          <path d="M22 74 C42 54 66 70 84 50 C94 39 104 44 110 54" stroke="#1280C2" stroke-width="13" stroke-linecap="round" fill="none"/>
          <circle cx="110" cy="54" r="7" fill="#ffffff"/>
        </svg>
      </div>
      <div class="flash"></div>
    </div>

    <div class="text-group">
      <div class="txt-autoscuole">AUTOSCUOLE</div>
      <div class="txt-gasparella">Gasparella</div>
    </div>
  </div>

  <div class="controls">
    <button id="replayBtn">▶ Replay</button>
    <span id="timeLabel">0.0s</span>
  </div>

<script>
  const stageGroup = document.getElementById('markGroup');
  const stage = document.getElementById('stage');
  const replayBtn = document.getElementById('replayBtn');
  const timeLabel = document.getElementById('timeLabel');
  let rafId = null, startTime = null;

  function play() {
    stageGroup.classList.remove('play');
    stage.classList.remove('play');
    void stageGroup.offsetWidth; // reflow to restart CSS animations
    stageGroup.classList.add('play');
    stage.classList.add('play');
    startTime = performance.now();
    tick();
  }
  function tick(now) {
    if (!startTime) startTime = now || performance.now();
    const t = ((now || performance.now()) - startTime) / 1000;
    timeLabel.textContent = Math.min(t, 3).toFixed(1) + 's';
    if (t < 3) rafId = requestAnimationFrame(tick);
  }

  replayBtn.addEventListener('click', play);
  window.addEventListener('load', () => setTimeout(play, 200));
  setInterval(() => { if (!rafId || performance.now() - startTime > 3400) play(); }, 3400);
</script>

</body>
</html>
